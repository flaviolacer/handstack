# Source: handstack/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: handstack-api
  labels:
    helm.sh/chart: handstack-0.1.0
    app.kubernetes.io/name: handstack
    app.kubernetes.io/instance: handstack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: handstack
      app.kubernetes.io/instance: handstack
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: handstack
        app.kubernetes.io/instance: handstack
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: handstack
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: api
              topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: handstack
              app.kubernetes.io/instance: handstack
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/handstack/api:0.1.0
          
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef: { name: handstack-config }
            - secretRef: { name: handstack-external }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
