# Source: handstack/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: handstack-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: handstack
      app.kubernetes.io/instance: handstack
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: handstack
              app.kubernetes.io/instance: handstack
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: handstack
              app.kubernetes.io/instance: handstack
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3001 }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
