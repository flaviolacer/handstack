name: Bug report
description: Report a reproducible defect in HandStack
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, personal data, or production secrets. For security vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the released version or short commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, npm, deployment profile, and relevant provider/database.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest commands or example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or screenshots when useful.
    validations:
      required: true
