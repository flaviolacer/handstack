{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "handstack.secretName" . }}
  labels:
    {{- include "handstack.labels" . | nindent 4 }}
  {{- with .Values.externalSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  database-url: {{ required "database.url is required when externalSecrets.createSecret=true" .Values.database.url | quote }}
  redis-url: {{ required "queue.redisUrl is required when externalSecrets.createSecret=true" .Values.queue.redisUrl | quote }}
  master-key: {{ required "encryption.masterKey is required when externalSecrets.createSecret=true" .Values.encryption.masterKey | quote }}
{{ if .Values.webhooks.masterKey }}
  webhook-master-key: {{ .Values.webhooks.masterKey | quote }}
{{ end }}
  internal-service-token: {{ required "internalService.token is required when externalSecrets.createSecret=true" .Values.internalService.token | quote }}
{{- end }}
