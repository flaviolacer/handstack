apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "handstack.fullname" . }}-config
  labels:
    {{- include "handstack.labels" . | nindent 4 }}
data:
  HANDSTACK_DEPLOYMENT_PROFILE: {{ .Values.deploymentProfile | quote }}
  HANDSTACK_DATABASE_ADAPTER: {{ .Values.database.adapter | quote }}
  HANDSTACK_REDIS_TOPOLOGY: {{ .Values.queue.topology | quote }}
  HANDSTACK_REDIS_STREAM_PENDING_CLAIM_IDLE_MS: {{ .Values.queue.pendingClaimIdleMs | quote }}
  HANDSTACK_PRIVACY_RETENTION_ENABLED: {{ .Values.privacyRetention.enabled | quote }}
  HANDSTACK_PRIVACY_RETENTION_INTERVAL_MS: {{ .Values.privacyRetention.intervalMs | quote }}
  HANDSTACK_AUDIT_INTEGRITY_ENABLED: {{ .Values.auditIntegrity.enabled | quote }}
  HANDSTACK_AUDIT_INTEGRITY_INTERVAL_MS: {{ .Values.auditIntegrity.intervalMs | quote }}
  HANDSTACK_AUDIT_INTEGRITY_ORGANIZATIONS: {{ join "," .Values.auditIntegrity.organizations | quote }}
  HANDSTACK_KNOWLEDGE_SYNC_ENABLED: {{ .Values.knowledgeSync.enabled | quote }}
  HANDSTACK_KNOWLEDGE_SYNC_INTERVAL_MS: {{ .Values.knowledgeSync.intervalMs | quote }}
  HANDSTACK_KNOWLEDGE_SYNC_ORGANIZATIONS: {{ join "," .Values.knowledgeSync.organizations | quote }}
  HANDSTACK_PLUGIN_TRUSTED_PUBLISHERS_JSON: {{ .Values.pluginRegistry.trustedPublishers | toJson | quote }}
  HANDSTACK_OBJECT_STORAGE_ENDPOINT: {{ .Values.objectStorage.endpoint | quote }}
  HANDSTACK_OBJECT_STORAGE_BUCKET: {{ .Values.objectStorage.bucket | quote }}
  HANDSTACK_API_PORT: {{ .Values.api.port | quote }}
  HANDSTACK_MCP_PORT: {{ .Values.mcp.port | quote }}
