    acceptanceCriteria: The provider passes the shared discovery, health, chat, tools, streaming, usage and finish contract through an injected transport; incremental tool JSON is emitted only after block completion; the default AWS SDK transport constructs for a valid region; timeout and cancellation yield sanitized closed errors without AWS details.
