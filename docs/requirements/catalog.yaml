    title: Official initial provider factory bootstrap
    normativeStatement: HandStack MUST provide one official factory bootstrap for every initial LLM adapter; provider-specific non-secret transport settings MUST be stored separately from secretReference, factories MUST receive only a model definition already authorized by the tenant runtime, required public settings and endpoint rules MUST fail fast, credential resolution MUST remain lazy, and AWS Bedrock MUST use workload identity or the AWS credential chain rather than a registry secret reference.
