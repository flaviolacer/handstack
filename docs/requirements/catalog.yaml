  - id: HS-AI-003
    title: Native Anthropic and Gemini provider contracts
    normativeStatement: The official native Anthropic and Gemini LLMProviders MUST translate vendor-neutral messages, system instructions, tool definitions and calls, streaming events, usage, and finish reasons through their native HTTP APIs; credentials MUST be resolved per request and sent only in vendor authorization headers; remote endpoints MUST require HTTPS; timeout, cancellation, transport, HTTP, and invalid response failures MUST expose only closed sanitized errors.
    rationale: Native APIs have different message, tool, stream, and accounting envelopes; explicit adapters preserve one stable execution contract without leaking SDK or credential details into product code.
