  - id: HS-API-004
    title: Tenant budgets, reservations and usage endpoints
    normativeStatement: HandStack MUST support tenant-scoped budget scopes and periods, transactional hard-limit reservations, settlement records and authenticated budget/usage administration without cross-tenant access.
