  - id: HS-AI-008
    title: Atomic audit and bounded telemetry for model governance
    normativeStatement: Every provider/model registration, versioned evaluation dataset or suite registration, evaluation run, gate recording, approval, and publication MUST persist a tenant-scoped append-only audit event; administrative mutations and their mandatory event MUST commit atomically, and registry, evaluation, chat, and stream operations MUST expose closed OpenTelemetry operations and outcomes without prompts, responses, evidence, credentials, error text, or tenant identifiers as metric attributes.
    rationale: Evaluation gates without durable provenance and administrative promotions without atomic audit can be bypassed or become unverifiable, while unconstrained telemetry can leak sensitive model traffic and create unbounded cardinality.
    owner: ai-platform-team
    status: verified
    risk: critical
    affectedModules:
      - packages/models/src/index.ts
      - packages/model-registry/src/index.ts
      - packages/evaluation/src/index.ts
      - packages/model-runtime/src/index.ts
      - packages/telemetry/src/ai-governance.ts
    publicContracts:
      [
        AiGovernanceTelemetry,
        AiGovernanceOpenTelemetry,
        ModelAuditEvent,
        ModelRegistry,
        CoreEvaluationProvider,
      ]
    dataEntities: [ModelAuditEvent, EvaluationRun, EvaluationGate, ModelDefinition]
    securityPrivacyImpact: Audit metadata is an explicit scalar allowlist of IDs, versions, lifecycle states, counts, classification, and outcomes; dataset cases, prompts, evidence, scores, provider responses, error messages, credentials, and secret references are excluded. Telemetry attributes contain only closed operation and outcome values.
    acceptanceCriteria: Successful governance mutations create tenant-isolated events; rerunning an idempotent evaluation does not duplicate its event; secret references, vendor model IDs, evidence, and provider errors are absent from audit and telemetry; failure to append mandatory audit rolls back the administrative mutation; success, failure, stream completion, and stream iteration failure close spans and record exactly one bounded observation.
    testIds:
      [
        HS-T-M3-AUDIT-ATOMIC-001,
        HS-T-M3-AUDIT-REDACTION-001,
        HS-T-M3-TELEMETRY-001,
        HS-T-M3-TELEMETRY-STREAM-001,
