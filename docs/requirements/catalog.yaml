      - packages/model-registry/src/index.ts
    publicContracts: [OpenAPI, createProviderSchema, createModelSchema, ModelAdminController]
    dataEntities: [ProviderDefinition, ModelDefinition, ModelAuditEvent]
    securityPrivacyImpact: Access tokens and models.manage are mandatory; organization path and token must match before repository access; secret references are write-only and secret-like public configuration is rejected and defensively redacted from reads.
    acceptanceCriteria: An authorized administrator can register and list providers and draft models through /api/v1; requests and responses appear in /api/openapi.json; missing authentication, missing permission and cross-tenant paths fail; unknown fields and secret-like configuration fail validation; responses and audit output do not expose secret references or values.
