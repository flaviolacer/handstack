    acceptanceCriteria: An authorized administrator can register and list a governed dataset and a suite bound to its exact version; OpenAPI contains both collections; missing minimum metrics, duplicate cases, unknown fields, or unsafe production data fail; unprivileged and cross-tenant callers fail; list and create responses contain no case content or legal-basis text.
