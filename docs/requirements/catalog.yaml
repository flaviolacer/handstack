    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-OPS-003
    title: Privacy-safe identity observability
    normativeStatement: SSO and identity administration MUST emit OpenTelemetry spans, operation counters, and latency histograms using a closed low-cardinality operation vocabulary and MUST NOT attach credentials, claims, exception messages, or tenant, user, and provider identifiers.
    rationale: Identity integrations require latency and failure visibility, but unrestricted telemetry attributes can leak authentication material and create unbounded observability cost.
    owner: platform-team
    status: verified
    risk: critical
    affectedModules:
      - packages/telemetry/src/identity.ts
      - apps/api/src/auth/oidc.controller.ts
      - apps/api/src/auth/identity-admin-telemetry.interceptor.ts
    publicContracts: [IdentityTelemetry, IdentityTelemetrySink, IdentityOperation]
    dataEntities: []
    securityPrivacyImpact: Only identity.operation and identity.outcome are exported; failures set span status without recording exception message or stack; no identity or tenant identifiers are telemetry dimensions.
    acceptanceCriteria: Successful and failed measured operations record one bounded observation and close their span; failure propagates unchanged; serialized observations and statuses contain no supplied secret-bearing exception message; OIDC and every identity administration handler are instrumented.
    testIds: [HS-T-M2-IDENTITY-OTEL-SUCCESS-001, HS-T-M2-IDENTITY-OTEL-REDACTION-001]
    testPaths:
      - packages/telemetry/tests/identity.test.ts
      - apps/api/tests/oidc.http.test.ts
      - apps/api/tests/identity-admin.http.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-SEC-008
    title: Atomic identity deprovisioning and credential revocation
    normativeStatement: User deprovisioning MUST atomically disable the tenant-scoped user, principal, and organization membership; revoke every active session, API key, and break-glass registration; deny all existing and new authentication paths immediately; preserve external identity and audit history; and be idempotent.
    rationale: Disabling only a user row leaves refresh sessions, automation credentials, emergency access, or tenant-adjacent records able to outlive employment or membership termination.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity-service/src/index.ts
      - packages/auth-service/src/index.ts
      - apps/api/src/auth/identity-admin.controller.ts
    publicContracts: [IdentityAdministrationService, IdentityAdminController]
    dataEntities:
      [
        User,
        Principal,
        OrganizationMembership,
        Session,
        ApiKey,
        BreakGlassAccount,
        IdentityAuditEvent,
      ]
    securityPrivacyImpact: A single tenant transaction uses one revocation timestamp and retains evidence; the endpoint requires identity.manage and route/token organization equality; API-key authentication also revalidates the principal state.
    acceptanceCriteria: Deprovisioning revokes two active sessions and one API key, rejects access token, refresh token, API key, and password login immediately, leaves a same-ID user in another tenant active, emits one redacted USER_DEPROVISIONED event, and a repeated call is a no-op.
    testIds:
      [
        HS-T-M2-DEPROVISION-ATOMIC-001,
        HS-T-M2-DEPROVISION-CREDENTIALS-001,
        HS-T-M2-DEPROVISION-HTTP-001,
      ]
    testPaths:
      - packages/auth-service/tests/authentication.test.ts
      - apps/api/tests/identity-admin.http.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-SEC-009
    title: Provenance-safe OIDC group and role mapping
    normativeStatement: OIDC claims MUST grant HandStack group membership or roles only through tenant-scoped, administrator-configured exact-value allowlist mappings; reconciliation MUST apply during JIT, account linking, and recurring login and MUST remove only assignments whose IdP mapping provenance is persisted.
    rationale: Treating arbitrary external claims as authorization creates privilege escalation, while reconciliation without provenance can delete manually administered access.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity/src/index.ts
      - packages/identity-storage/src/index.ts
      - packages/identity-service/src/index.ts
      - apps/api/src/auth/identity-admin.controller.ts
      - apps/web/app/settings/identity-providers/identity-providers-client.tsx
    publicContracts: [IdentityMapping, IdentityMappingGrant, IdentityMappingInput]
    dataEntities: [IdentityMapping, IdentityMappingGrant, GroupMembership, PrincipalRole]
    securityPrivacyImpact: Claim names are flat validated identifiers, source values use exact string comparison, targets must already exist in the same organization, mapping count is bounded, and only provenance-backed assignments are removed.
    acceptanceCriteria: An administrator can configure group and role mappings through RBAC-protected API and UI; matching claims create both assignments; a later empty claim removes mapped assignments but preserves a manual group membership; mapping changes and reconciliation emit redacted audit events.
    testIds:
      [
        HS-T-M2-MAPPING-ALLOWLIST-001,
        HS-T-M2-MAPPING-PROVENANCE-001,
        HS-T-M2-MAPPING-HTTP-001,
        HS-T-M2-MAPPING-UI-001,
      ]
    testPaths:
      - packages/identity-service/tests/identity-providers.test.ts
      - apps/api/tests/identity-admin.http.test.ts
      - apps/web/tests/identity-api.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-SEC-010
    title: Bounded and redacted OIDC connection diagnostics
    normativeStatement: Identity administrators MUST be able to validate an OIDC provider discovery document and JWKS before enablement; the check MUST require HTTPS endpoints and exact issuer matching, reject redirects, enforce timeout and response-size bounds, require a usable typed key, and expose, audit, and measure only closed diagnostic values.
    rationale: Unbounded or verbose outbound diagnostics can become an SSRF amplification path and can leak provider configuration, remote response contents, or secrets into clients and telemetry.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - apps/api/src/auth/oidc-runtime.service.ts
      - apps/api/src/auth/identity-admin.controller.ts
      - apps/api/src/auth/identity-admin-telemetry.interceptor.ts
      - apps/web/app/settings/identity-providers/identity-providers-client.tsx
    publicContracts: [OidcConnectionTestResult, testOidcConnection, IdentityAdminController]
    dataEntities: [IdentityProvider, IdentityAuditEvent]
    securityPrivacyImpact: Requests use HTTPS without redirects, a five-second abort signal, and 256 KiB per-document limit; public and audit results contain only ok, stage, and a closed code; telemetry retains only the closed operation and outcome.
    acceptanceCriteria: An identity.manage administrator can start a test from API and UI; valid discovery and JWKS succeed; issuer mismatch, insecure endpoint, empty JWKS, and timeout produce redacted closed failures; cross-tenant and unauthorized calls remain denied.
    testIds:
      [
        HS-T-M2-OIDC-CONNECTION-SUCCESS-001,
        HS-T-M2-OIDC-CONNECTION-FAILURE-001,
        HS-T-M2-OIDC-CONNECTION-TIMEOUT-001,
        HS-T-M2-OIDC-CONNECTION-HTTP-001,
        HS-T-M2-OIDC-CONNECTION-UI-001,
      ]
    testPaths:
      - apps/api/tests/oidc-connection.test.ts
      - apps/api/tests/identity-admin.http.test.ts
      - apps/web/tests/identity-api.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-DATA-010
    title: Versioned identity persistence compatibility
    normativeStatement: Every M2 identity and authentication aggregate MUST use the canonical migrated DatabaseAdapter through stable, tenant-scoped repository namespaces; the namespace manifest MUST be versioned and append-only within a schema version, and representative identity, provider, and session records MUST remain readable after adapter shutdown, migration rerun, and reopen.
    rationale: Identity data that works only within one process or silently changes repository namespaces cannot safely survive deployment, restart, or upgrade.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity-storage/src/index.ts
      - packages/database/typeorm/src/migrations/initial-schema.ts
      - packages/database/mongodb/src/migrations.ts
    publicContracts: [IdentityStorage, identityStorageSchema]
    dataEntities: [Organization, User, IdentityProvider, Session]
    securityPrivacyImpact: All namespaces remain tenant-scoped through the same migrated adapter; the compatibility manifest contains names and a version only, never identity data or credentials.
    acceptanceCriteria: The manifest snapshot covers every M2 repository namespace; a file-backed SQLite adapter persists organization, user, provider policy, and session data; closing and reopening the migrated adapter reads the same scoped values without data loss.
    testIds: [HS-T-M2-STORAGE-MANIFEST-001, HS-T-M2-STORAGE-REOPEN-001]
    testPaths: [packages/identity-storage/tests/storage.test.ts]
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-AI-001
    title: Tenant-scoped model registry with fail-closed evaluation publication
    normativeStatement: HandStack MUST represent providers and models through vendor-neutral contracts and stable tenant-scoped registry records; model aliases MUST be unique per Organization, provider secrets MUST remain references, and a model MUST NOT become published unless a persisted, passing evaluation gate matches its recorded suite version and has been explicitly approved.
    rationale: Direct vendor model references and UI-only approval checks make routing brittle and allow untested model changes to reach stable execution paths.
    owner: ai-platform-team
    status: verified
    risk: critical
    affectedModules:
      - packages/models/src/index.ts
      - packages/model-registry/src/index.ts
      - packages/evaluation/src/index.ts
    publicContracts:
      [LLMProvider, EvaluationProvider, ModelDefinition, ProviderDefinition, ModelRegistry]
    dataEntities:
      [
        ProviderDefinition,
        ModelDefinition,
        EvaluationSuite,
        EvaluationDataset,
        EvaluationRun,
        EvaluationGate,
      ]
    securityPrivacyImpact: Registry isolation is enforced by organization predicates; only secret references are stored; provider data-classification allowlists are explicit; approved datasets carry classification, provenance, owner and retention metadata; production data additionally requires legal basis and sanitization; publication revalidates immutable persisted run provenance and fails closed.
    acceptanceCriteria: Provider and model records persist through the canonical adapter; IDs and aliases resolve only within their organization; duplicate aliases and cross-tenant providers fail; approved versioned datasets and suites cover the product minimum quality, tool, security and efficiency metrics; fabricated, failed, absent or stale runs block approval/publication; a passing persisted current run permits evaluated, approved, then published transitions.
    testIds:
      [
        HS-T-M3-PROVIDER-CONTRACT-001,
        HS-T-M3-EVALUATION-CORE-001,
        HS-T-M3-EVALUATION-GOVERNANCE-001,
        HS-T-M3-REGISTRY-GATE-001,
        HS-T-M3-REGISTRY-ISOLATION-001,
      ]
    testPaths:
      - packages/models/tests/contracts.test.ts
      - packages/evaluation/tests/evaluation.test.ts
      - packages/model-registry/tests/registry.test.ts
    documentationArticleIds: [getting-started/model-registry]
    introducedVersion: 0.3.0
  - id: HS-API-005
    title: Governed capability registry and execution API
    normativeStatement: HandStack MUST register tenant-scoped capabilities with schemas and allowed channels, and Web/API/MCP/Agent adapters MUST execute through one engine applying authorization, guardrails, budget, rate limit, approval, timeout, audit and telemetry hooks.
    rationale: A single governed execution path prevents channel-specific authorization bypasses.
