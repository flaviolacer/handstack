      - apps/api/src/scim/scim-error.filter.ts
      - apps/api/src/scim/scim-runtime.service.ts
    publicContracts:
      [
        ScimController,
        ScimAdminController,
        ScimAuthGuard,
        ScimErrorFilter,
        ScimCredentialService,
        ScimCredentialStore,
        ScimRuntimeService,
      ]
    dataEntities: [ScimUser, ScimGroup, ScimCredential, ScimNotFoundError, ScimConflictError]
    securityPrivacyImpact: The raw SCIM token is returned once and only its HMAC-SHA256 digest is stored; authentication is a tenant-scoped constant-time lookup keyed by the organization embedded in the token; the organization is never taken from a client-supplied path or body; mutations require an If-Match version; rate limits and durable audit fire per mutation; failures are sanitized RFC 7644 errors without internal details.
    acceptanceCriteria: A dedicated token authenticates user and group CRUD plus ServiceProviderConfig, ResourceTypes and Schemas discovery; missing or invalid tokens return 401; create returns 201 with Location and ETag; externalId upserts are idempotent; stale If-Match returns 409 and unknown ids return 404 with RFC 7644 error bodies; a token issued for one organization cannot read another; an identity.manage administrator can issue, rotate and revoke the credential while an unprivileged principal is denied.
    testIds: [HS-T-M37-SCIM-HTTP-001, HS-T-M37-SCIM-AUTH-001, HS-T-M37-SCIM-CONFLICT-001]
    testPaths:
      - packages/scim/tests/scim.test.ts
      - apps/api/tests/scim.http.test.ts
    documentationArticleIds: [getting-started/scim]
    introducedVersion: 0.35.0
  - id: HS-API-014
    title: Typed public TypeScript SDK
    normativeStatement: HandStack MUST provide a dependency-free typed TypeScript SDK that authenticates with an API key held only in memory, sends bearer credentials exclusively in the authorization header, exposes the OpenAI-compatible gateway and the organization-scoped REST surface, supports bounded timeout, cancellation and SSE streaming, and maps RFC 9457 Problem Details into typed actionable errors carrying status, code, requestId, traceId and helpArticleId.
    rationale: Existing OpenAI SDKs and integration code need one stable, typed, transport-safe client without leaking credentials or vendor identifiers, while custom callers benefit from exact route and error contracts.
    owner: platform-team
    status: verified
    risk: high
    affectedModules:
      - packages/sdk/src/index.ts
      - packages/sdk/src/client.ts
      - packages/sdk/src/errors.ts
      - packages/sdk/src/sse.ts
    publicContracts: [HandStack, HandStackApiError, HandStackSdkError, FetchLike, parseSse]
    dataEntities: []
    securityPrivacyImpact: API keys are never persisted or written to URLs or request bodies and are sent only in the authorization header; timeouts and cancellation use AbortSignal; typed errors expose only closed Problem Details fields and never internal stacks; SSE parsing bounds memory and stops at the [DONE] sentinel.
    acceptanceCriteria: A client built from baseUrl and apiKey lists gateway models, runs a governed capability through the organization-scoped endpoint, generates a neutral model response, streams SSE chunks and stops at [DONE], and maps problem-detail responses and aborted transports into typed errors with the original status and code.
    testIds: [HS-T-M38-SDK-001]
    testPaths: [packages/sdk/tests/sdk.test.ts]
    documentationArticleIds: [getting-started/sdk]
    introducedVersion: 0.36.0
  - id: HS-SEC-018
    title: Scoped multi-metric rate limiting
    normativeStatement: HandStack MUST enforce rate limits across organization, group, user, API key, agent, model and capability scopes using requests-per-minute, tokens-per-minute, concurrent-requests and daily-requests metrics, keep every counter tenant-scoped so one organization's limit never consumes another's capacity, and return a typed 429 with retry guidance.
    rationale: Shared AI capacity requires per-tenant and per-principal admission control to prevent one consumer from starving others while preserving deterministic denial behavior across compact and distributed profiles.
    owner: platform-team
    status: verified
    risk: high
    affectedModules:
      - packages/rate-limiting/src/index.ts
      - packages/rate-limiting/package.json
    publicContracts:
      [
        ScopedRateLimiter,
        RateLimitStore,
        InMemoryRateLimitStore,
        RateLimitRule,
        RateLimitContext,
        RateLimitDecision,
        raiseRateLimitError,
      ]
    dataEntities: [RateLimitRule, RateLimitDecision]
    securityPrivacyImpact: Every counter key embeds organizationId plus scope and scopeId so tenants cannot bleed capacity; concurrency slots are acquired and released explicitly; denials use the shared typed RateLimitError and expose only the exceeded scope, metric and retry seconds.
    acceptanceCriteria: A requests-per-minute rule denies a third request within the window and resets after it; a tokens-per-minute rule charges token deltas; a daily rule enforces an independent window; a concurrency rule rejects a second in-flight acquisition until release; identical rules keyed to different tenants or scopes do not interfere; and empty organizations or invalid limits fail with a typed error.
    testIds: [HS-T-M39-RATELIMIT-001]
    testPaths: [packages/rate-limiting/tests/rate-limit.test.ts]
    documentationArticleIds: [getting-started/rate-limiting]
    introducedVersion: 0.37.0
