    publicContracts: [IdentityProvidersClient, identityApi]
    dataEntities: [IdentityProvider, OrganizationLoginPolicy]
    securityPrivacyImpact: The Bearer credential is held only in component memory and is never placed in a URL, request body, localStorage, or sessionStorage; secret references use a password field and provider responses contain only secret presence.
    acceptanceCriteria: The route renders in the administrative shell; can load, create, enable, and disable providers and save enforcement policy; shows explicit loading, empty, error, and ready states; confirms disable; remains responsive; and exposes contextual Help Center guidance.
    testIds: [HS-T-M2-IDENTITY-UI-ROUTE-001, HS-T-M2-IDENTITY-UI-CLIENT-001]
    testPaths:
