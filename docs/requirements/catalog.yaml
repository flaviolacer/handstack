  - id: HS-AI-004
    title: Azure OpenAI, OpenRouter, and vLLM provider specializations
    normativeStatement: Azure OpenAI, OpenRouter, and vLLM MUST implement the complete LLMProvider contract through the official OpenAI-compatible core while preserving provider-specific endpoint and authorization rules; Azure MUST require explicit resource, deployment, and API version and use only the api-key header; OpenRouter MAY send explicit public application attribution; vLLM MUST reject insecure non-loopback URLs.
