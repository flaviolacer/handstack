  - id: HS-SEC-014
    title: Encryption at rest for secrets
    normativeStatement: HandStack MUST encrypt sensitive values at rest with AES-256-GCM under a 256-bit master key loaded from HANDSTACK_MASTER_KEY, derive purpose keys with HKDF-SHA256, bind ciphertext to organization and plugin context through GCM additional authenticated data, and never include plaintext, key material, or ciphertext in errors or logs.
    rationale: Secrets persisted in the database or object storage must remain unreadable after a storage disclosure and must stay tenant-bound so a sealed value cannot be opened from another organization.
    owner: security-platform-team
    status: verified
    risk: critical
    affectedModules:
      - packages/core/src/encryption.ts
      - packages/core/src/index.ts
    publicContracts:
      [
        MasterKey,
        encryptSecret,
        decryptSecret,
        sealSecret,
        openSecret,
        parseEnvelope,
        EncryptedSecretStore,
      ]
    dataEntities: [SealedSecret]
    securityPrivacyImpact: Ciphertext uses a fresh random 96-bit nonce and a 128-bit authentication tag; AAD binds each envelope to organizationId and pluginId; purpose keys are HKDF-derived so a compromise of one purpose does not expose the master key; failures collapse to a redacted EncryptionError without material.
    acceptanceCriteria: Sealing and opening round-trip the plaintext; the same plaintext produces distinct nonces; a wrong key, mismatched AAD, tampered ciphertext, and malformed envelope each fail with a redacted EncryptionError; hex and base64 32-byte keys decode equally; purpose derivation is deterministic and separated; the encrypted store persists only envelopes and opens them only within the sealing organization.
    testIds: [HS-T-M34-ENCRYPTION-001, HS-T-M34-ENCRYPTION-002, HS-T-M34-ENCRYPTION-003]
    testPaths: [packages/core/tests/encryption.test.ts]
    documentationArticleIds: [getting-started/encryption-secrets]
    introducedVersion: 0.32.0
