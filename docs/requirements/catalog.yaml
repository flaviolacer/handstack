    acceptanceCriteria: OpenAPI contains the neutral response operation; an evaluated and published OpenAI-compatible, Anthropic and Gemini model each return the common response through the same route; a draft model and an unprivileged caller fail; no caller payload or response exposes provider model IDs, endpoints, secret references or credential values.
