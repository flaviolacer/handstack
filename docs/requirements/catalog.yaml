  - id: HS-AI-013
    title: Versioned prompt publication gates
    normativeStatement: HandStack MUST store tenant-bound Prompt resources and immutable PromptVersion snapshots containing content, declared variables, digest and internal model route; prompt evaluation runs and gates MUST bind the exact version, content digest and model definition; stable publication MUST require prompts.manage and a passing persisted gate for that unchanged snapshot, and new content or a new model route MUST begin as DRAFT without inheriting approval.
    rationale: Prompt behavior can change independently of a model, so model-only evaluation cannot prove that the deployed prompt/model combination is safe or reproducible.
