    acceptanceCriteria: A custom capability is listed and executed through the API with the same engine authorization; disallowed channels, missing permission, timeout and failure release reservations and produce audit hooks.
    testIds: [HS-T-M7-CAPABILITY-001, HS-T-M7-CAPABILITY-002]
    testPaths:
