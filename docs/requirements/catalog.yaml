    dataEntities: [EvaluationRun, EvaluationResult, EvaluationGate, ModelDefinition]
    securityPrivacyImpact: The route, model, provider, dataset, suite, run and gate remain tenant-bound; clients submit identifiers only; case inputs and responses are not returned or persisted in clear text; secret values resolve only at provider request time from the restricted HANDSTACK_SECRET namespace.
    acceptanceCriteria: A draft model executes through an official provider factory and yields response-derived minimum metrics; request-supplied scores and nonexistent run digests fail; only a passing persisted run can move the same model through EVALUATED, APPROVED and PUBLISHED; approval before evaluation fails; OpenAPI documents every operation; results, audit and API payloads contain no case or secret material.
    testIds:
      [
        HS-T-M3-EVAL-RUNNER-001,
        HS-T-M3-EVAL-NO-FABRICATION-001,
        HS-T-M3-EVAL-LIFECYCLE-001,
