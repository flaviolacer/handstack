    securityPrivacyImpact: prompts.manage and exact organization binding protect all administration; prompt content is omitted from audit metadata; runs persist only subject identifiers, digest, scores and evidence digests; stale or cross-version gates fail closed.
    acceptanceCriteria: An authorized administrator creates a prompt and immutable version, evaluates the rendered prompt through its bound model, records the persisted gate, approves and publishes it; publication before the gate fails; a new version remains DRAFT and cannot reuse the earlier run; OpenAPI documents all operations and an unprivileged caller receives 403.
