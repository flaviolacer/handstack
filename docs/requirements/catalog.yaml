  - id: HS-AI-002
    title: OpenAI-compatible provider contract and sanitized transport
    normativeStatement: The official OpenAI-compatible LLMProvider MUST implement model discovery, health, chat, tool calls, SSE streaming, normalized finish reasons and usage, cancellation and bounded timeout; it MUST resolve credentials at request time, require HTTPS for remote endpoints, restrict insecure HTTP to explicitly allowed loopback hosts, reject redirects, and expose only sanitized error codes and optional HTTP status.
    rationale: Provider-specific payloads, uncontrolled transport, and verbose upstream failures otherwise leak credentials and make routing behavior inconsistent across OpenAI, Ollama, and compatible servers.
    owner: ai-platform-team
    status: verified
    risk: critical
    affectedModules:
