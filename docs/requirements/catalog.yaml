    title: Native AWS Bedrock provider contract
    normativeStatement: The official AWS Bedrock LLMProvider MUST use the AWS SDK credential provider chain and SigV4 transport by default, discover foundation models, translate Converse and ConverseStream messages, system prompts, tools, incremental tool input, usage, and stop reasons into the neutral provider contract, propagate cancellation and bounded timeouts, and expose no raw AWS errors or credential material.
    rationale: Bedrock authentication and event-stream semantics are not OpenAI-compatible; a native boundary is required to support workload identity and temporary credentials without leaking AWS-specific contracts into product code.
