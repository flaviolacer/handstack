  - id: HS-API-003
    title: OpenAI-compatible virtual-key gateway
    normativeStatement: HandStack MUST expose /v1/models and /v1/chat/completions through tenant-scoped virtual API keys, enforce key expiry/revocation/model allowlists/rate limits, return the secret only once, support synchronous and SSE responses, and append redacted lifecycle audit events without bypassing the governed model runtime.
    rationale: Existing OpenAI SDKs need a provider-neutral endpoint while HandStack retains authorization, publication, privacy and usage controls.
    owner: gateway-team
    status: verified
    risk: critical
    affectedModules:
      - packages/gateway/src/index.ts
      - apps/api/src/gateway/gateway.controller.ts
      - apps/api/src/gateway/openai-compatible.controller.ts
      - apps/api/src/gateway/gateway-runtime.service.ts
    publicContracts: [VirtualApiKeyService, GatewayController, OpenAiCompatibleController]
    dataEntities: [VirtualApiKey, IdentityAuditEvent]
    securityPrivacyImpact: Full secrets are never persisted or returned after issuance; authentication is constant-time and tenant-scoped; revoked, expired, unauthorized and disallowed-model requests fail closed; audit metadata contains no key material or prompts.
    acceptanceCriteria: An authorized administrator issues, lists and revokes a key; an OpenAI-compatible caller lists only permitted published models and can receive JSON or SSE completions; malformed, expired, revoked, cross-tenant, rate-limited and model-disallowed requests fail without provider traffic; lifecycle events are durable and redacted.
