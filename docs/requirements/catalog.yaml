        SecretResolver,
        ModelRuntimeObserver,
      ]
    dataEntities: [ProviderDefinition, ModelDefinition]
    securityPrivacyImpact: Tenant-scoped registry lookups and classification checks precede provider creation; only the registered secret reference can be resolved for the active Organization; provider failures are redacted; observations contain scoped IDs, health, and token counts only.
    acceptanceCriteria: Published model chat and stream resolve both alias and ID to the vendor model, use the tenant secret reference, and record health/usage; cross-tenant lookups, denied classifications, unpublished or unavailable models, duplicate factories, and unknown adapters fail closed before provider traffic; observations never contain secret values.
    testIds:
      [HS-T-M3-RUNTIME-EXECUTION-001, HS-T-M3-RUNTIME-TENANT-001, HS-T-M3-RUNTIME-PRIVACY-001]
    testPaths: [packages/model-runtime/tests/runtime.test.ts]
