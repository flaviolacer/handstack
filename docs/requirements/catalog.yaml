      - packages/model-runtime/tests/runtime.test.ts
      - packages/telemetry/tests/ai-governance.test.ts
    documentationArticleIds: [getting-started/model-registry]
    introducedVersion: 0.3.0
  - id: HS-AI-009
    title: Versioned provider and model administration API
    normativeStatement: HandStack MUST expose authenticated provider and model registration/listing under /api/v1 with Zod as the canonical request and response schema source, generated OpenAPI, strict unknown-field rejection, exact route/token/repository tenant binding, and models.manage authorization; public provider representations MUST replace secretReference with a boolean presence marker and MUST reject or redact secret-like configuration keys.
    rationale: A registry that is reachable only from internal code cannot satisfy the public administration contract, while loosely validated or tenant-ambiguous endpoints can leak credentials and create IDOR vulnerabilities.
