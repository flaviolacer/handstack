  - id: HS-AI-011
    title: Server-derived evaluation and model publication workflow
    normativeStatement: HandStack MUST execute pre-publication model evaluations through the tenant-authorized official provider factory, derive minimum gate scores from the actual neutral provider response, persist only bounded results and evidence digests, accept no caller-supplied scores, rebuild a gate only from a persisted run digest, and block approval and publication unless the current versioned gate passed; model secret references MUST resolve lazily through the restricted tenant runtime and MUST NOT appear in records, responses, telemetry, audit, or errors.
    rationale: Allowing clients to assert scores or requiring publication before evaluation makes the release gate circular and forgeable; evaluating through a different transport than production also invalidates provider compatibility and security evidence.
    owner: ai-platform-team
    status: verified
    risk: critical
    affectedModules:
