  - id: HS-AI-006
    title: Tenant-aware fail-closed model execution runtime
    normativeStatement: Product execution MUST address models only by an internal ModelDefinition ID or alias plus Organization and data classification; the runtime MUST resolve a PUBLISHED model and enabled provider within that Organization, enforce the provider classification allowlist before external traffic, instantiate only a registered adapter, map to providerModel internally, resolve only the provider's stored secret reference in tenant scope, and expose closed runtime errors while observing health and usage without secret material.
    rationale: Calling vendor model IDs or provider factories directly bypasses evaluation publication, tenant isolation, privacy policy, and secret boundaries established by the model registry.
