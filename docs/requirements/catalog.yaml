    dataEntities: [SandboxProfile, SandboxHandle, SandboxExecutionResult, SecretHandle]
    securityPrivacyImpact: Network is deny-by-default with private, loopback, link-local and metadata targets blocked unless explicitly allowlisted; secret handles are tenant-bound and expire; output is truncated to profile limits; termination is observable; and a fail-closed provider rejects execution when no concrete executor is available.
    acceptanceCriteria: Profiles reject empty organization, non-positive time/output limits, empty allowlists and cross-tenant secret handles; destinations resolve only against the allowlist with private targets blocked by default; secrets resolve only when provisioned, unexpired and tenant-bound; output is truncated; providers execute through an injected executor and refuse execution after termination; the fail-closed provider and the sandbox extension wiring report healthy state.
