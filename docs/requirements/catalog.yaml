    introducedVersion: 0.3.0
  - id: HS-AI-012
    title: Neutral multi-provider model response API
    normativeStatement: HandStack MUST expose one authenticated tenant-bound response API that accepts only an internal model ID or alias, explicit data classification, neutral messages and optional neutral tools; it MUST require models.execute, resolve only a published evaluated model and its provider internally, enforce classification before provider traffic, and return the common ChatResponse without exposing vendor identifiers, endpoints, secret references or credentials; the same API MUST generate responses through at least three official providers.
