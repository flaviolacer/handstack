  - id: HS-API-006
    title: Agent harness with governed capability tools
    normativeStatement: HandStack MUST execute published AgentVersions through a bounded LLM loop that enforces declared tool allowlists, timeouts, iteration limits, budget hooks and lifecycle events, invoking tools only through CapabilityExecutionEngine.
    rationale: Agent autonomy must not bypass capability authorization, tenant isolation or cost controls.
