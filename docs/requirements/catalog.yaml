  - id: HS-AI-010
    title: Governed evaluation dataset and suite administration API
    normativeStatement: HandStack MUST expose authenticated tenant-bound registration and metadata listing for versioned evaluation datasets and suites under /api/v1; datasets MUST carry approval, classification, provenance, owner, retention, unique cases, and production-data legal-basis and sanitization controls; suites MUST bind an exact dataset version and include every product-minimum model gate metric; public responses MUST omit case inputs, expected outputs, and legal-basis text, and clients MUST NOT submit evaluation scores through these collection endpoints.
    rationale: Evaluation gates are not reproducible without governed versioned inputs, while returning case material or accepting client-computed scores would leak evaluation data and allow publication controls to be forged.
