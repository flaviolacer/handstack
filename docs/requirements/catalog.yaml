    dataEntities: [ExporterPayload]
    securityPrivacyImpact: Organization scope is preserved; secret-bearing keys are redacted recursively; transports are injected so credentials remain outside event payloads; durable audit remains authoritative.
    acceptanceCriteria: All five exporter kinds use the same transport boundary; batches respect the configured maximum; sensitive nested attributes are redacted; invalid events, non-finite values and transport failures produce typed errors.
    testIds: [HS-T-M42-OBSERVABILITY-001, HS-T-M42-OBSERVABILITY-002]
    testPaths: [packages/observability-exporters/tests/exporters.test.ts]
    documentationArticleIds: [getting-started/observability-exporters]
    introducedVersion: 0.40.0
  - id: HS-OPS-012
    title: Official compact and distributed deployment profiles
    normativeStatement: HandStack MUST provide an official compact single-container profile running API, UI and SQLite without Redis, Compose profiles that isolate PostgreSQL and MongoDB development dependencies, and a production Kubernetes/Helm profile with stateless Web/API/MCP replicas, specialized workers, probes, resources, HPA, KEDA, PDB, NetworkPolicies and externally managed secrets.
    rationale: Operators need a reproducible zero-infrastructure development path and a complete production topology without coupling credentials or state to images and manifests.
    owner: platform-team
    status: verified
    risk: critical
    affectedModules:
      [
        deploy/docker/single-container.contract.json,
        deploy/docker-compose/compose.yaml,
        deploy/helm/handstack,
        scripts/validate_container_contract.mjs,
      ]
    publicContracts: [SingleContainerDeploymentContract, DockerComposeProfiles, HandStackHelmChart]
    dataEntities: [DeploymentProfile]
    securityPrivacyImpact: Compact images use SQLite and no Redis; production secrets are externalized; distributed workloads are stateless and use readiness/liveness, resource and network isolation defaults.
    acceptanceCriteria: The compact contract validates API/UI/SQLite without Redis and required health checks; Compose exposes separate PostgreSQL/MongoDB profiles; the Helm chart structurally validates workloads, HPA/KEDA, PDB, NetworkPolicy, topology and external secrets.
    testIds: [HS-T-M43-DEPLOYMENT-001, HS-T-M43-DEPLOYMENT-002]
    testPaths: [scripts/validate_container_contract.mjs, scripts/validate_helm_chart.mjs]
    documentationArticleIds: [getting-started/deployment-profiles]
    introducedVersion: 0.41.0
  - id: HS-OPS-013
    title: Active-standby multi-region disaster recovery contract
    normativeStatement: HandStack MUST define an active-write and warm-standby multi-region topology with health-based global failover, replicated database/object storage/secrets configuration, fencing before promotion, consistency validation, smoke tests before traffic, RPO <= 5 minutes, RTO <= 15 minutes and separately audited failback.
    rationale: Regional failure must not create split-brain authorization, budget or audit state, and recovery objectives must be explicit and verifiable rather than implied by deployment replicas.
    owner: platform-team
    status: verified
    risk: critical
    affectedModules:
      [deploy/resilience/multi-region-dr.contract.json, scripts/validate_dr_contract.mjs]
    publicContracts: [MultiRegionDisasterRecoveryContract]
    dataEntities: [DisasterRecoveryExercise]
    securityPrivacyImpact: Only one region accepts authoritative writes; replicated secrets remain behind an approved provider; fencing, consistency checks and audit-gated failback protect tenant, budget and authorization state.
    acceptanceCriteria: The contract validates active/warm standby regions, health-based DNS, RPO/RTO targets, fencing, replication, consistency and smoke gates, stateless services and separate audited failback.
    testIds: [HS-T-M44-DR-001, HS-T-M44-DR-002]
    testPaths: [scripts/validate_dr_contract.mjs]
    documentationArticleIds: [getting-started/multi-region-recovery]
    introducedVersion: 0.42.0
  - id: HS-SEC-019
    title: Tenant-scoped service accounts and workload identities
    normativeStatement: HandStack MUST provide service accounts as machine principals distinct from human users, issue each tenant-scoped client secret only once, store only a one-way digest, support explicit scopes, expiry, rotation and revocation, and route authentication through the normal authorization boundary.
    rationale: Automation and workloads require revocable credentials without sharing human login sessions or passwords, while every machine action must retain tenant, scope, budget and audit controls.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules: [packages/service-accounts/src/index.ts]
    publicContracts:
      [
        ServiceAccount,
        ServiceAccountPrincipal,
        ServiceAccountStore,
        InMemoryServiceAccountStore,
        ServiceAccountService,
        signServiceAccountContext,
      ]
    dataEntities: [ServiceAccount]
    securityPrivacyImpact: Raw secrets are returned only on issue/rotation and never persisted; authentication is tenant-bound and constant-time; revoked or expired accounts fail closed and do not enter human login flows.
    acceptanceCriteria: Accounts issue with unique safe scopes, authenticate as SERVICE_ACCOUNT, isolate organizations, reject invalid credentials, rotate and invalidate old secrets, expire, revoke and list without exposing secret material.
    testIds: [HS-T-M45-SERVICE-ACCOUNT-001, HS-T-M45-SERVICE-ACCOUNT-002]
    testPaths: [packages/service-accounts/tests/service-accounts.test.ts]
    documentationArticleIds: [getting-started/service-accounts]
    introducedVersion: 0.43.0
  - id: HS-SEC-020
    title: Secure SAML and LDAP identity provider contracts
    normativeStatement: HandStack MUST provide specialized SAML 2.0 and LDAP/LDAPS identity provider contracts with injected verification/transports, HTTPS or LDAPS enforcement, tenant-scoped identities, bounded timeouts, anti-replay for assertions and secret references instead of inline credentials.
    rationale: Enterprise SSO needs protocol-specific security boundaries without coupling the identity domain to a vendor SDK or silently treating Entra ID and traditional Active Directory as the same protocol.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules: [packages/plugin-saml/src/index.ts, packages/plugin-ldap/src/index.ts]
    publicContracts:
      [SamlIdentityProvider, SamlResponseVerifier, ReplayStore, LdapIdentityProvider, LdapTransport]
    dataEntities: [SamlAssertion, LdapUser]
    securityPrivacyImpact: SAML signatures are delegated to an explicit verifier and consumed assertions are replay-protected; LDAP requires LDAPS and secret references, never inline passwords. Offline contracts do not certify a real identity provider, certificate chain or directory.
    acceptanceCriteria: SAML rejects insecure endpoints, invalid tenant/provider scope, expired or replayed assertions, and bounded verification failures; LDAP rejects non-LDAPS endpoints and inline credentials, uses an injected transport, maps users to the configured organization and closes the transport after each attempt.
    testIds: [HS-T-M46-SAML-001, HS-T-M46-LDAP-001]
    testPaths: [packages/plugin-saml/tests/saml.test.ts, packages/plugin-ldap/tests/ldap.test.ts]
    documentationArticleIds: [getting-started/enterprise-identity-protocols]
    introducedVersion: 0.44.0
  - id: HS-SEC-021
    title: Identity plugin contract test kit
    normativeStatement: HandStack MUST provide an official identity plugin test kit that validates manifest, apiVersion, permissions, configuration schema, tenant isolation, timeout, fail-closed behavior, secret leakage prevention and applicable protocol capabilities through deterministic probes.
    rationale: Identity extensions must preserve the authorization, tenant, privacy and audit boundaries before activation, without requiring live external providers in every test run.
    owner: identity-team
    status: verified
    risk: high
    affectedModules: [packages/plugin-testkit/src/index.ts]
