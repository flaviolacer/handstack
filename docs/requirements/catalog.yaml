version: 1
requirements:
  - id: HS-AI-014
    title: Governed multimodal chat workspace
    normativeStatement: HandStack MUST provide a responsive tenant-bound chat workspace that lists only published models for chat.use callers, persists multimodal messages and attachments before execution, consumes durable SSE with cursor-based reconnection and deduplication, supports cancellation, executable edit/regenerate/retry branches, owner-scoped archive/restore/privacy deletion with content-free durable audit evidence, and keeps bearer credentials only in memory.
    rationale: End users need one safe provider-neutral UI without bypassing model publication, tenant authorization, attachment scanning, or durable stream semantics.
    owner: ai-platform-team
    status: verified
    risk: critical
    affectedModules:
      - packages/chat/src/index.ts
      - packages/chat/src/execution.ts
      - apps/api/src/chat/chat.controller.ts
      - apps/api/src/chat/chat-runtime.service.ts
      - apps/web/app/chat/chat-api.ts
      - apps/web/app/chat/chat-client.tsx
      - apps/web/app/chat/page.tsx
    publicContracts: [ChatController, ChatExecutionService, chatApi, streamEvents]
    dataEntities:
      [
        Conversation,
        ConversationBranch,
        Message,
        MessagePart,
        Attachment,
        ChatStreamEvent,
        ChatAuditEvent,
      ]
    securityPrivacyImpact: chat.use and exact route/token organization binding are mandatory; model catalog exposes only published non-secret fields; access tokens remain in memory and outside URLs; attachments are scoped, scanned and signed; provider failures are redacted.
    acceptanceCriteria: A chat.use principal can create and paginate conversations, choose a published model, append text and scanned attachments, receive incremental model output after reconnecting from Last-Event-ID without duplication, cancel a stream, execute immutable edit/regenerate/retry branches, and archive/restore/delete owned conversations; deletion purges content and retains no content in audit, unprivileged and cross-tenant access fails, and browser storage contains no bearer credential.
    testIds:
      [
        HS-T-M4-API-RBAC-001,
        HS-T-M4-STREAM-RECONNECT-001,
        HS-T-M4-WEB-CLIENT-001,
        HS-T-M4-ATTACHMENT-001,
      ]
    testPaths:
      - packages/chat/tests/chat.test.ts
      - apps/api/tests/chat.http.test.ts
      - apps/web/tests/chat-api.test.ts
      - apps/web/tests/routes.test.tsx
      - apps/web/tests/chat-client.test.tsx
      - apps/web/tests/e2e/chat.e2e.ts
    documentationArticleIds: [user/chat-workspace]
    introducedVersion: 0.4.0
  - id: HS-CORE-001
    title: npm Turborepo monorepo foundation
    normativeStatement: HandStack MUST use npm (or yarn when selected by the workspace) and Turborepo with explicit application and package boundaries.
    rationale: A single workspace keeps modular-monolith contracts consistent across deployable processes.
    owner: core-team
    status: verified
    risk: medium
    affectedModules: [package.json, apps, packages, turbo.json]
    publicContracts: []
    dataEntities: []
    securityPrivacyImpact: Dependency boundaries prevent infrastructure leakage into domain code.
    acceptanceCriteria: Root lint, typecheck, test, and build commands execute every current workspace.
    testIds: [HS-T-M0-WORKSPACE-001]
    testPaths: [packages/core/tests/event-bus.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-CORE-002
    title: Strict TypeScript baseline
    normativeStatement: All TypeScript MUST enable strict mode, noImplicitAny, noUncheckedIndexedAccess, and exactOptionalPropertyTypes.
    rationale: Strong compile-time contracts reduce ambiguity across extension and persistence boundaries.
    owner: core-team
    status: verified
    risk: medium
    affectedModules: [tsconfig.base.json, eslint.config.mjs]
    publicContracts: []
    dataEntities: []
    securityPrivacyImpact: Strict types reduce unsafe error and authorization handling.
    acceptanceCriteria: The repository typecheck and lint gates pass without suppressing type errors.
    testIds: [HS-T-M0-TYPES-001]
    testPaths: [packages/shared/tests/problem-details.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-CORE-003
    title: Versioned extension provider registry
    normativeStatement: Cross-cutting providers MUST register through closed, versioned extension contracts and resolve deterministically by organization and priority.
    rationale: Plugins may extend the platform without bypassing core governance.
    owner: core-team
    status: verified
    risk: high
    affectedModules: [packages/core/src/extensions.ts]
    publicContracts: [ExtensionProvider, ExtensionRegistry]
    dataEntities: [ExtensionRegistration]
    securityPrivacyImpact: Mandatory providers remain explicit and tenant-scoped resolution is deterministic.
    acceptanceCriteria: Tenant registrations resolve before global registrations and duplicates are rejected.
    testIds: [HS-T-M0-EXT-001, HS-T-M0-EXT-002]
    testPaths: [packages/core/tests/extensions.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-API-001
    title: Fastify API health contract
    normativeStatement: The NestJS API MUST use Fastify and expose separate liveness and readiness endpoints without leaking dependency secrets.
    rationale: Distributed orchestration requires safe process and dependency health signals.
    owner: api-team
    status: verified
    risk: high
    affectedModules: [apps/api/src/main.ts, apps/api/src/health/health.controller.ts]
    publicContracts: [/health, /health/live, /health/ready]
    dataEntities: []
    securityPrivacyImpact: Health responses expose status classes only, never credentials or connection strings.
    acceptanceCriteria: Liveness excludes dependency checks and readiness reports configured dependency state.
    testIds: [HS-T-M0-HEALTH-001]
    testPaths: [apps/api/tests/health.service.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-API-002
    title: Typed Problem Details
    normativeStatement: Public HTTP errors MUST use RFC 9457 Problem Details with stable HandStack codes, requestId, traceId, and actionable helpArticleId where applicable.
    rationale: Clients need safe, stable, diagnosable failures.
    owner: api-team
    status: verified
    risk: high
    affectedModules:
      [packages/shared/src/problem-details.ts, apps/api/src/http/problem-details.filter.ts]
    publicContracts: [ProblemDetails]
    dataEntities: []
    securityPrivacyImpact: Unknown internal errors are redacted before returning to clients.
    acceptanceCriteria: Typed errors retain stable codes and unknown errors do not expose internal messages.
    testIds: [HS-T-M0-PROBLEM-001, HS-T-M0-PROBLEM-002]
    testPaths: [packages/shared/tests/problem-details.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-CORE-004
    title: Validated hierarchical configuration
    normativeStatement: Configuration MUST use environment, config file, database settings, and organization settings hierarchy with exactly one explicit primary database adapter.
    rationale: Compact and distributed profiles require predictable portable configuration.
    owner: core-team
    status: verified
    risk: high
    affectedModules: [packages/config/src/index.ts, handstack.config.ts]
    publicContracts: [HandStackConfig, defineConfig, configFromEnvironment]
    dataEntities: []
    securityPrivacyImpact: Configuration schema rejects unknown fields and telemetry is opt-in.
    acceptanceCriteria: SQLite compact defaults validate, MongoDB can be selected alone, and invalid adapters or ports fail startup parsing.
    testIds: [HS-T-M0-CONFIG-001, HS-T-M0-CONFIG-002, HS-T-M0-CONFIG-003]
    testPaths: [packages/config/tests/config.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DOC-001
    title: Canonical localized documentation source
    normativeStatement: Public docs and the in-product Help Center MUST render the same docs-as-code source with English and Portuguese parity.
    rationale: Self-hosted users need version-matched, offline-capable guidance without content drift.
    owner: docs-team
    status: verified
    risk: high
    affectedModules:
      [packages/docs-engine/src/index.ts, apps/docs/app, apps/web/app/help, docs/content]
    publicContracts: [DocumentationArticle, ArticleMetadata]
    dataEntities: []
    securityPrivacyImpact: Article metadata supports audience and permission-aware presentation.
    acceptanceCriteria: Frontmatter and required operational sections validate in both locales and both surfaces render the canonical article body.
    testIds: [HS-T-M0-DOCS-001, HS-T-M0-DOCS-002, HS-T-M0-DOCS-003]
    testPaths:
      [
        packages/docs-engine/tests/documentation.test.ts,
        apps/docs/tests/routes.test.tsx,
        apps/web/tests/routes.test.tsx,
      ]
    documentationArticleIds: [user/help-center]
    introducedVersion: 0.1.0
  - id: HS-UX-001
    title: Responsive branded Help Center shell
    normativeStatement: The Web application MUST expose Help Center navigation and responsive design tokens from a 360px viewport width.
    rationale: Guidance is a product feature available to users and administrators on supported devices.
    owner: web-team
    status: verified
    risk: medium
    affectedModules: [apps/web/app/globals.css, apps/web/app/help]
    publicContracts: [/help, /help/:articleId]
    dataEntities: []
    securityPrivacyImpact: Navigation uses packaged article IDs and does not require external network access.
    acceptanceCriteria: Workspace, Help catalog, localized article routes, keyboard focus styles, and the mobile breakpoint render.
    testIds: [HS-T-M0-WEB-001, HS-T-M0-WEB-002, HS-T-M0-WEB-003]
    testPaths: [apps/web/tests/routes.test.tsx]
    documentationArticleIds: [user/help-center]
    introducedVersion: 0.1.0
  - id: HS-DATA-001
    title: Adapter-neutral persistence contracts
    normativeStatement: Domain modules MUST depend only on canonical tenant-aware repository and transaction contracts, never database-specific concepts.
    rationale: SQL and MongoDB must preserve public and domain behavior while remaining independently deployable primary adapters.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      [packages/domain/src/persistence.ts, docs/architecture/persistence-conformance.yaml]
    publicContracts: [Repository, TransactionManager, TransactionContext]
    dataEntities: [TenantEntity]
    securityPrivacyImpact: Every repository operation requires an explicit tenant isolation predicate.
    acceptanceCriteria: Contracts express tenant scope, opaque cursor pagination, optimistic concurrency, and transaction options without infrastructure types.
    testIds: [HS-T-M1-PERSISTENCE-001]
    testPaths: [packages/domain/tests/persistence.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-002
    title: UUIDv7 canonical identifiers
    normativeStatement: New persistent HandStack entities MUST use canonical RFC 9562 UUIDv7 identifiers independent of database-native IDs.
    rationale: Portable, time-ordered identifiers avoid coupling exports and domain contracts to SQL sequences or MongoDB ObjectId.
    owner: data-team
    status: verified
    risk: high
    affectedModules: [packages/domain/src/uuid-v7.ts]
    publicContracts: [uuidV7, isUuidV7]
    dataEntities: [TenantEntity.id]
    securityPrivacyImpact: Random UUID bits prevent simple sequential identifier enumeration.
    acceptanceCriteria: Generated identifiers have UUID version 7 and RFC variant bits, remain unique and lexically monotonic within a millisecond, and reject invalid timestamps.
    testIds: [HS-T-M1-UUID-001, HS-T-M1-UUID-002, HS-T-M1-UUID-003]
    testPaths: [packages/domain/tests/uuid-v7.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-003
    title: TypeORM SQL persistence adapter
    normativeStatement: SQLite and PostgreSQL persistence MUST implement the canonical repository and transaction contracts through TypeORM with managed migrations.
    rationale: One SQL implementation preserves domain behavior while allowing the recommended production and zero-infrastructure databases.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      - packages/database/typeorm/src/adapter.ts
      - packages/database/typeorm/src/repository.ts
      - packages/database/typeorm/src/migrations/initial-schema.ts
    publicContracts: [TypeOrmAdapter, TypeOrmRepository]
    dataEntities: [handstack_entities]
    securityPrivacyImpact: Composite keys and every query include repository and tenant predicates.
    acceptanceCriteria: SQLite runs managed migrations and passes tenant isolation, conflict mapping, cursor pagination, optimistic concurrency, and transaction rollback tests.
    testIds: [HS-T-M1-SQL-001, HS-T-M1-SQL-002, HS-T-M1-SQL-003, HS-T-M1-SQL-004]
    testPaths: [packages/database/typeorm/tests/typeorm-conformance.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-004
    title: MongoDB first-class persistence adapter
    normativeStatement: MongoDB MUST operate as the only primary database through the official driver with managed document migrations, schema validation, tenant indexes, and canonical transactions.
    rationale: MongoDB is a first-class production alternative and cannot require a hidden SQL dependency.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      - packages/database/mongodb/src/adapter.ts
      - packages/database/mongodb/src/repository.ts
      - packages/database/mongodb/src/migrations.ts
      - packages/database/mongodb/src/schema.ts
    publicContracts: [MongoAdapter, MongoRepository, DocumentMigration]
    dataEntities: [handstack_entities, handstack_migrations]
    securityPrivacyImpact: JSON schema rejects unmanaged fields and compound indexes enforce tenant-scoped uniqueness.
    acceptanceCriteria: The adapter initializes without SQL, applies versioned migrations and validators, and exposes the canonical repository and transaction contracts.
    testIds: [HS-T-M1-MONGO-SCHEMA-001, HS-T-M1-MONGO-INDEX-001, HS-T-M1-MONGO-MIGRATION-001]
    testPaths: [packages/database/mongodb/tests/schema.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-005
    title: Configuration-driven primary database lifecycle
    normativeStatement: HandStack MUST select exactly one primary database adapter from validated configuration and manage its initialization, migrations, readiness, and shutdown lifecycle.
    rationale: Deployments must switch adapters without changing domain contracts or public APIs.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      - packages/database/src/index.ts
      - packages/config/src/index.ts
      - apps/api/src/database/database.service.ts
      - apps/api/src/health/health.service.ts
    publicContracts: [DatabaseAdapter, createDatabaseAdapter, /health/ready]
    dataEntities: [handstack_entities]
    securityPrivacyImpact: Adapter-specific URL validation prevents accidental cross-driver interpretation and readiness exposes status only.
    acceptanceCriteria: SQLite initializes and migrates through the factory, MongoDB selection creates no SQL connection, incompatible URL schemes fail validation, and API readiness reports database up.
    testIds: [HS-T-M1-FACTORY-001, HS-T-M1-FACTORY-002, HS-T-M1-CONFIG-URL-001, HS-T-M1-READY-001]
    testPaths:
      - packages/database/tests/factory.test.ts
      - packages/config/tests/config.test.ts
      - apps/api/tests/health.http.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-006
    title: Shared persistence conformance harness
    normativeStatement: Every official database adapter MUST pass the same canonical repository and transaction behavior suite without conditional skips.
    rationale: Matching method names do not guarantee SQL and MongoDB behavioral portability.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      - packages/domain/src/repository-conformance.ts
      - packages/database/typeorm/tests/postgresql.integration.test.ts
      - packages/database/mongodb/tests/mongodb.integration.test.ts
      - .github/workflows/ci.yml
    publicContracts: [ConformanceAdapter, verifyRepositoryConformance]
    dataEntities: [handstack_entities]
    securityPrivacyImpact: The harness verifies tenant isolation and atomic rollback on every adapter.
    acceptanceCriteria: SQLite runs the harness locally while CI provisions PostgreSQL and MongoDB replica-set and runs mandatory integration commands requiring explicit URLs.
    testIds:
      [
        HS-T-M1-CONFORMANCE-SQLITE-001,
        HS-T-M1-CONFORMANCE-POSTGRES-001,
        HS-T-M1-CONFORMANCE-MONGO-001,
      ]
    testPaths:
      - packages/database/tests/factory.test.ts
      - packages/database/typeorm/tests/postgresql.integration.test.ts
      - packages/database/mongodb/tests/mongodb.integration.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-007
    title: Complete official SQL adapter matrix
    normativeStatement: MySQL, MariaDB, and SQL Server MUST use the canonical TypeORM persistence implementation, managed migrations, and shared conformance harness alongside SQLite and PostgreSQL.
    rationale: Every SQL database promised by the support matrix must preserve identical tenant, pagination, concurrency, and transaction semantics.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      - packages/database/typeorm/src/adapter.ts
      - packages/database/typeorm/src/migrations/initial-schema.ts
      - packages/database/src/index.ts
      - .github/workflows/ci.yml
    publicContracts: [SqlAdapterConfig, TypeOrmAdapter, createDatabaseAdapter]
    dataEntities: [handstack_entities]
    securityPrivacyImpact: All supported SQL engines retain composite tenant-scoped keys and mandatory tenant predicates.
    acceptanceCriteria: Configuration selects MySQL, MariaDB, and SQL Server through their official drivers, portable migrations initialize each engine, and CI runs the canonical conformance harness against every adapter without conditional skips.
    testIds:
      [HS-T-M1-MYSQL-001, HS-T-M1-MARIADB-001, HS-T-M1-SQLSERVER-001, HS-T-M1-SQL-FACTORY-001]
    testPaths:
      - packages/database/typeorm/tests/official-sql.integration.test.ts
      - packages/database/tests/factory.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-DATA-008
    title: Signed portable persistence protocol
    normativeStatement: Cross-adapter data movement MUST use a versioned, tenant-aware, streaming and resumable protocol with canonical checksums, a signed manifest, logical metadata, and transactional import staging.
    rationale: SQL and MongoDB migrations require independently verifiable parity and safe recovery from interruption or tampering.
    owner: data-team
    status: verified
    risk: critical
    affectedModules:
      - packages/database/src/portable.ts
      - packages/database/src/adapter-portable.ts
      - packages/database/typeorm/src/migrations/portable-import.ts
      - packages/database/mongodb/src/migrations.ts
    publicContracts:
      [
        PortableSource,
        PortableSink,
        exportPortable,
        importPortable,
        verifyPortable,
        comparePortable,
      ]
    dataEntities: [PortableRecord, PortableManifest, PortableFrame]
    securityPrivacyImpact: Tenant scope is enforced, plaintext secret fields are rejected, manifests use HMAC-SHA256, and invalid staged imports roll back before commit.
    acceptanceCriteria: Exports stream canonical records and metadata from SQL or MongoDB with tenant predicates, imports resume after durable checkpoints, tampered content never commits, and verification and comparison report count or checksum divergence.
    testIds:
      [
        HS-T-M1-PORTABLE-ROUNDTRIP-001,
        HS-T-M1-PORTABLE-TAMPER-001,
        HS-T-M1-PORTABLE-RESUME-001,
        HS-T-M1-PORTABLE-TENANT-001,
        HS-T-M1-PORTABLE-COMPARE-001,
      ]
    testPaths:
      - packages/database/tests/portable.test.ts
      - packages/database/tests/factory.test.ts
      - packages/database/tests/mongodb-portable.integration.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-OPS-001
    title: Portable database CLI commands
    normativeStatement: The HandStack CLI MUST expose streaming portable export, import, verification, comparison, backup, and restore commands over the canonical persistence protocol.
    rationale: Operators require one adapter-independent interface for migration preflight, copy, integrity verification, and reconciliation.
    owner: platform-team
    status: verified
    risk: high
    affectedModules:
      - packages/cli/src/bin.ts
      - packages/cli/src/database-command.ts
      - packages/cli/src/codec.ts
      - packages/cli/src/file-runtime.ts
      - packages/cli/src/backup-command.ts
    publicContracts:
      [
        handstack database,
        handstack backup,
        handstack restore,
        executeDatabaseCommand,
        executeBackupCommand,
        DatabaseCommandRuntime,
        BackupCommandRuntime,
      ]
    dataEntities: [PortableFrame NDJSON]
    securityPrivacyImpact: Signing material is read from HANDSTACK_PORTABLE_SIGNING_KEY and is never accepted as a process argument or written to output.
    acceptanceCriteria: Export and import require --portable, NDJSON is streamed and validated, verify rejects malformed or unsigned data, compare fails on canonical divergence, backup writes redacted adapter/schema metadata, restore validates compatibility before staging, and required arguments produce actionable errors.
    testIds:
      [
        HS-T-M1-CLI-ROUNDTRIP-001,
        HS-T-M1-CLI-INVALID-001,
        HS-T-M1-CLI-COMPARE-001,
        HS-T-M1-CLI-BACKUP-001,
      ]
    testPaths:
      - packages/cli/tests/database-command.test.ts
      - packages/cli/tests/backup-command.test.ts
    documentationArticleIds: [getting-started/portable-backup]
    introducedVersion: 0.1.0
  - id: HS-OPS-002
    title: Database migration and diagnostic commands
    normativeStatement: The HandStack CLI MUST apply managed database migrations and expose a machine-readable diagnostic covering connectivity, engine version discovery, transactions, schema, indexes, and migration currency.
    rationale: Operators need deterministic initialization and preflight evidence before starting or upgrading an installation.
    owner: platform-team
    status: verified
    risk: high
    affectedModules:
      - packages/database/src/operations.ts
      - packages/cli/src/operational-command.ts
      - packages/cli/src/bin.ts
    publicContracts: [handstack migrate, handstack doctor, databaseMigrationStatus, databaseDoctor]
    dataEntities: [MigrationStatus, DoctorReport]
    securityPrivacyImpact: Reports contain database capability metadata but never echo connection URLs or credentials.
    acceptanceCriteria: Adapter initialization applies managed migrations; migrate reports applied and pending migrations; doctor reports every mandatory check as JSON and exits nonzero when any check fails.
    testIds: [HS-T-M1-MIGRATE-001, HS-T-M1-DOCTOR-001, HS-T-M1-CLI-OPS-001]
    testPaths:
      - packages/database/tests/operations.test.ts
      - packages/cli/tests/operational-command.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.1.0
  - id: HS-SEC-001
    title: Tenant-safe identity and policy core contracts
    normativeStatement: Identity, authentication, provider integration, and authorization MUST be separated into vendor-neutral contracts with explicit organization scope and deny-by-default policy evaluation.
    rationale: Every authentication method and provider must converge on one internal Principal and authorization model without weakening tenant isolation.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity/src/index.ts
      - packages/identity-sdk/src/index.ts
      - packages/auth/src/index.ts
      - packages/policy/src/index.ts
    publicContracts: [Principal, User, IdentityProviderCapability, Session, ApiKey, PolicyEngine]
    dataEntities:
      [Organization, Principal, User, Group, ExternalIdentity, Session, Role, Permission]
    securityPrivacyImpact: Organization-owned data carries organizationId, credentials require Argon2id or one-way hashes, refresh cookies are hardened, and unmatched or cross-tenant authorization is denied.
    acceptanceCriteria: Core packages contain no vendor SDK; identity scopes cannot silently diverge from repository tenant scope; capabilities are namespaced; policy evaluation enforces organization, principal, resource, action, group, time, and explicit-deny precedence.
    testIds:
      [
        HS-T-M2-IDENTITY-SCOPE-001,
        HS-T-M2-IDP-CAPABILITY-001,
        HS-T-M2-AUTH-CONTRACT-001,
        HS-T-M2-POLICY-001,
      ]
    testPaths:
      - packages/identity/tests/identity.test.ts
      - packages/identity-sdk/tests/capabilities.test.ts
      - packages/auth/tests/auth-contracts.test.ts
      - packages/policy/tests/policy.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.2.0
  - id: HS-DATA-009
    title: Multi-adapter identity persistence
    normativeStatement: Every identity, authentication, and authorization aggregate MUST persist through the canonical database abstraction with mandatory organization scope and equivalent transactional behavior on SQL and MongoDB.
    rationale: Selecting MongoDB or any official SQL adapter must not alter identity contracts, isolation, or rollback guarantees.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity-storage/src/index.ts
      - packages/database/src/index.ts
      - .github/workflows/ci.yml
    publicContracts: [IdentityStorage, OrganizationStores, ScopedRepository]
    dataEntities:
      [Organization, Principal, User, Group, Role, Permission, LocalCredential, Session, ApiKey]
    securityPrivacyImpact: Callers cannot obtain an organization-owned repository without a non-empty organizationId, cross-organization writes are rejected, and critical writes use serializable transactions.
    acceptanceCriteria: SQLite proves persistence, tenant isolation, scope rejection, and atomic rollback locally; CI runs equivalent persistence and rollback checks against a MongoDB replica set without skips.
    testIds: [HS-T-M2-STORAGE-SQLITE-001, HS-T-M2-STORAGE-MONGO-001]
    testPaths:
      - packages/identity-storage/tests/storage.test.ts
      - packages/identity-storage/tests/mongodb.integration.test.ts
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.2.0
  - id: HS-CORE-006
    title: Identity administration and persistent RBAC
    normativeStatement: Organization administrators MUST be able to create users and groups, manage memberships, define roles and permissions, and alter access through persistent role grants.
    rationale: The M2 acceptance flow requires authorization changes to be durable, tenant-safe, and independent of the selected database adapter.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity-service/src/index.ts
      - packages/identity-storage/src/index.ts
    publicContracts: [IdentityAdministrationService]
    dataEntities:
      [
        User,
        OrganizationMembership,
        Group,
        GroupMembership,
        Role,
        Permission,
        RolePermission,
        PrincipalRole,
      ]
    securityPrivacyImpact: Administrative writes are organization-scoped and serializable; authorization defaults to deny, validates the principal in the same organization, and resolves only tenant-local grants.
    acceptanceCriteria: An admin workflow creates a user and group, adds the user to the group, observes access denied before a permission grant, grants a dynamic role, observes access allowed afterward, and remains denied from another organization.
    testIds: [HS-T-M2-ADMIN-FLOW-001, HS-T-M2-USERNAME-UNIQUE-001, HS-T-M2-RBAC-TENANT-001]
    testPaths: [packages/identity-service/tests/administration.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.2.0
  - id: HS-SEC-002
    title: Local authentication and rotating credentials
    normativeStatement: Local authentication MUST hash passwords with Argon2id, issue short-lived signed access tokens, rotate hashed refresh tokens with reuse detection, and store API keys only as keyed hashes.
    rationale: Long-lived bearer material and recoverable credential storage would turn a database disclosure or token replay into durable account compromise.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/auth/src/index.ts
      - packages/auth-service/src/index.ts
      - packages/identity-storage/src/index.ts
    publicContracts: [AuthenticationService, LocalAuthenticator, SessionManager, AccessTokenClaims]
    dataEntities: [LocalCredential, Session, ApiKey]
    securityPrivacyImpact: Passwords use Argon2id; opaque secrets use 256 random bits and HMAC-SHA256 with a separate pepper; JWTs validate HS256, issuer, audience, and expiry; refresh reuse revokes the session durably.
    acceptanceCriteria: Valid local credentials log in, invalid credentials do not; stored password and bearer values do not contain plaintext; access claims verify; refresh rotates exactly once and replay revokes the successor; API keys authenticate until explicitly revoked.
    testIds:
      [
        HS-T-M2-ARGON2ID-001,
        HS-T-M2-SESSION-ROTATE-001,
        HS-T-M2-REFRESH-REUSE-001,
        HS-T-M2-API-KEY-001,
      ]
    testPaths: [packages/auth-service/tests/authentication.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.2.0
  - id: HS-SEC-003
    title: Generic secure OIDC provider plugin
    normativeStatement: OIDC authentication MUST use a vendor-neutral provider plugin with HTTPS discovery, Authorization Code plus PKCE, one-time state and nonce, signed ID-token validation, and tenant-scoped external identity linking.
    rationale: Enterprise identity providers must integrate through one protocol-safe boundary without coupling HandStack Core to vendor SDKs or accepting replayed callbacks.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity-sdk/src/index.ts
      - packages/plugin-oidc/src/index.ts
      - packages/identity-storage/src/index.ts
    publicContracts: [OidcIdentityProvider, GenericOidcPlugin, OidcPluginOptions]
    dataEntities: [OidcAuthorizationTransaction, ExternalIdentity]
    securityPrivacyImpact: Discovery and endpoints require HTTPS; PKCE uses S256; state secrets are persisted only as HMAC; transactions expire and are consumed once; ID tokens validate signature, issuer, audience, expiry, nonce, and subject.
    acceptanceCriteria: A generated authorization URL includes PKCE, state, and nonce; a callback exchanges the code and validates an RSA-signed ID token from discovered JWKS; the external identity is linked in the organization; replaying the same callback is rejected.
    testIds: [HS-T-M2-OIDC-PKCE-001, HS-T-M2-OIDC-IDTOKEN-001, HS-T-M2-OIDC-REPLAY-001]
    testPaths: [packages/plugin-oidc/tests/oidc.test.ts]
    documentationArticleIds: [getting-started/overview]
    introducedVersion: 0.2.0
  - id: HS-SEC-004
    title: Secure HTTP authentication sessions
    normativeStatement: Frontend authentication MUST expose short-lived access tokens only in no-store response bodies, keep rotating refresh tokens exclusively in hardened cookies, protect cookie-authenticated operations from CSRF, and revalidate persistent session and user state on protected requests.
    rationale: Browser storage, replayable refresh credentials, ambient cookie authority, and stateless acceptance after revocation each permit avoidable account compromise.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - apps/api/src/auth/auth.controller.ts
      - apps/api/src/auth/access-token.guard.ts
      - packages/auth-service/src/index.ts
    publicContracts: [AuthController, AccessTokenGuard, AuthenticatedRequest]
    dataEntities: [Session, User]
    securityPrivacyImpact: Refresh tokens are HttpOnly, Secure, SameSite=Strict, path-scoped, rotated and hashed; refresh requires a non-simple CSRF header; protected requests deny revoked sessions and disabled users immediately.
    acceptanceCriteria: Login never returns a refresh token in JSON; refresh rotates the cookie and rejects CSRF omission and replay; a Bearer token populates tenant-aware authentication context; logout revokes the session and the same access token is rejected.
    testIds: [HS-T-M2-HTTP-LOGIN-001, HS-T-M2-HTTP-REFRESH-001, HS-T-M2-HTTP-LOGOUT-001]
    testPaths:
      - apps/api/tests/auth.http.test.ts
      - packages/auth-service/tests/authentication.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-SEC-005
    title: Tenant-aware Identity Provider configuration and OIDC session bridge
    normativeStatement: Organizations MUST support multiple isolated Identity Providers whose persisted configuration contains no secret material, whose JIT and account-linking policies are explicit, and whose successful OIDC callbacks create revocable HandStack sessions.
    rationale: Protocol validation alone is insufficient if tenant configuration leaks credentials, silently links accounts, or bypasses the platform session boundary.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity/src/index.ts
      - packages/identity-service/src/index.ts
      - packages/core/src/secrets.ts
      - apps/api/src/auth/oidc-runtime.service.ts
      - apps/api/src/auth/oidc.controller.ts
    publicContracts:
      [IdentityProvider, IdentityProviderAdministrationService, SecretProvider, OidcController]
    dataEntities: [IdentityProvider, ExternalIdentity, User, Session]
    securityPrivacyImpact: Provider records contain an opaque secret reference only; the host supplies a tenant/plugin-scoped resolver; linking by verified email and JIT are opt-in; disabled and cross-tenant providers cannot authenticate.
    acceptanceCriteria: Multiple providers are ordered and isolated by organization; unsafe inline secret configuration is rejected; unverified or unapproved linking fails; verified-email linking and JIT work only when enabled; the OIDC HTTP callback links/provisions a principal and emits a revocable session without returning the refresh token in JSON.
    testIds: [HS-T-M2-IDP-CONFIG-001, HS-T-M2-IDP-LINKING-001, HS-T-M2-OIDC-HTTP-001]
    testPaths:
      - packages/identity-service/tests/identity-providers.test.ts
      - packages/core/tests/secrets.test.ts
      - apps/api/tests/oidc.http.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-SEC-006
    title: Organization login enforcement, break-glass, and identity audit
    normativeStatement: Organization login policy MUST prevent local authentication from bypassing SSO enforcement, restrict emergency local access to explicitly enabled and limited break-glass accounts, enforce a stronger dedicated password, and durably audit identity configuration and authentication outcomes without secret leakage.
    rationale: SSO controls are ineffective when local credentials bypass them, while unbounded emergency accounts and rollback-prone or secret-bearing audit records create critical security gaps.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - packages/identity/src/index.ts
      - packages/identity-service/src/index.ts
      - packages/auth-service/src/index.ts
      - packages/plugin-oidc/src/index.ts
      - apps/api/src/auth/oidc.controller.ts
    publicContracts:
      [OrganizationLoginPolicy, BreakGlassAccount, IdentityAuditEvent, IdentityAuditService]
    dataEntities: [OrganizationLoginPolicy, BreakGlassAccount, IdentityAuditEvent]
    securityPrivacyImpact: SSO-required organizations deny ordinary local credentials; break-glass is opt-in, capped, independently disableable, and requires a 20-character password; audit events are tenant-scoped and contain no passwords, tokens, client secrets, or raw claims.
    acceptanceCriteria: Local login succeeds by default but is denied under SSO policy; an explicitly registered break-glass user can log in and is denied again after disablement; account limits are enforced; a specific IdP policy rejects other providers; failed and successful local/OIDC paths plus configuration, JIT, linking, and break-glass actions produce durable redacted audit events.
    testIds: [HS-T-M2-LOGIN-ENFORCEMENT-001, HS-T-M2-BREAK-GLASS-001, HS-T-M2-IDENTITY-AUDIT-001]
    testPaths:
      - packages/auth-service/tests/authentication.test.ts
      - packages/identity-service/tests/identity-providers.test.ts
      - apps/api/tests/oidc.http.test.ts
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-SEC-007
    title: Authorized tenant-safe identity administration API
    normativeStatement: Identity administration endpoints MUST require an authenticated principal with explicit identity.manage permission, reject route and token organization mismatches before data access, and return provider representations without secret values or internal secret references.
    rationale: Correct identity policy is insufficient when its administrative control plane permits cross-tenant access, defaults to allow, or exposes secret-management internals.
    owner: identity-team
    status: verified
    risk: critical
    affectedModules:
      - apps/api/src/auth/identity-admin.controller.ts
      - apps/api/src/auth/access-token.guard.ts
      - packages/identity-service/src/index.ts
    publicContracts: [IdentityAdminController, AccessTokenGuard]
    dataEntities: [IdentityProvider, OrganizationLoginPolicy, BreakGlassAccount]
    securityPrivacyImpact: Every operation is Bearer-authenticated and denied unless identity.manage is granted in the token organization; cross-organization paths are rejected before RBAC repository access; provider output includes only a secret-presence boolean.
    acceptanceCriteria: An authorized administrator can list and create providers, toggle providers, update login policy, and enable or disable break-glass; a principal without permission and an administrator targeting another organization both receive HTTP 403; no response serializes a password or client secret reference.
    testIds:
      [
        HS-T-M2-IDENTITY-ADMIN-RBAC-001,
        HS-T-M2-IDENTITY-ADMIN-TENANT-001,
        HS-T-M2-IDENTITY-ADMIN-SECRETS-001,
      ]
    testPaths: [apps/api/tests/identity-admin.http.test.ts]
    documentationArticleIds: [getting-started/authentication-sessions]
    introducedVersion: 0.2.0
  - id: HS-UX-002
    title: Identity provider administration interface
    normativeStatement: The web application MUST expose a responsive Settings and Identity Providers route with accessible loading, empty, error, and ready states; secure OIDC configuration; provider enable and confirmed disable actions; login enforcement controls; and contextual help.
    rationale: Enterprise identity configuration requires an operable and understandable administrative surface rather than API-only setup or unsafe secret handling.
    owner: frontend-team
    status: verified
    risk: high
    affectedModules:
      - apps/web/app/settings/identity-providers/page.tsx
      - apps/web/app/settings/identity-providers/identity-providers-client.tsx
