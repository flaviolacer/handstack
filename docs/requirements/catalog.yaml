        verifyLLMProviderContract,
      ]
    dataEntities: []
    securityPrivacyImpact: API keys exist only in authorization headers produced after async secret resolution; redirects and insecure remote URLs are rejected; error bodies, headers, URLs, credentials, and network messages are never propagated.
    acceptanceCriteria: A deterministic OpenAI-compatible adapter passes the shared contract for models, health, chat, tools, stream completion, finish reason, and usage; timeout and HTTP failures use closed redacted errors; remote HTTP is rejected while explicit loopback Ollama HTTP is accepted.
    testIds:
